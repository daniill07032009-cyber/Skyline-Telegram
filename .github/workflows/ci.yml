name: Skyline multi-platform CI

on:
  pull_request:
    branches:
      - main
      - integration/telegram-skyline-foundation
  push:
    branches:
      - integration/telegram-skyline-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/skyline-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/skyline-web/package-lock.json
      - run: npm ci
      - run: npm run build

  node-api:
    name: Node API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/skyline-node-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/skyline-node-api/package-lock.json
      - run: npm ci
      - run: npm test

  python-api:
    name: Python API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/skyline-python-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/skyline-python-api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
        env:
          JWT_SECRET: skyline-ci-only-test-secret-not-for-production
      - run: python -m pytest -q
        env:
          JWT_SECRET: skyline-ci-only-test-secret-not-for-production

  android:
    name: Android debug APK compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/telegram-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and NDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then
            echo "sdkmanager --licenses failed with exit code $license_status" >&2
            exit "$license_status"
          fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Create ephemeral CI debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
      - name: Compile upstream baseline debug APK
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: skyline-android-baseline-debug
          path: apps/telegram-android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 7
